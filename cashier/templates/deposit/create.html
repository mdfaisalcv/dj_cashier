[[extend 'layout.html']]

[[block header]]
[[icon='fa fa-chart-line']]
[[breadcamp = 'Deposits']]

[[end]]

[[block content]]

<style>
/* Chrome, Safari, Edge, Opera */
.no-spinner::-webkit-outer-spin-button,
.no-spinner::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Firefox */
.no-spinner {
  -moz-appearance: textfield;
}

/* IE 10+ */
.no-spinner::-ms-clear,
.no-spinner::-ms-expand {
  display: none;
  width: 0;
  height: 0;
}

.table > :not(caption) > * > *{
    padding: 0.1rem;
}
</style>

<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Create</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <a href="[[=URL('deposit/index')]]" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
        </div>
    </div>
    <div class="container py-2">

        <form action="[[=URL('deposit','submit')]]" method="POST">

        <div id="custom_form">        
            <div class="row">                
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="transaction_date" class="form-label">Transaction Date</label>
                        <div class="flatpickr-wrapper">
                            <input type="text" class="form-control form-control-sm date-picker" id="transaction_date" name="transaction_date" placeholder="Select Transaction Date" value="[[=formatted_date]]">
                            <i class="fa fa-calendar calendar-icon text-secondary calendar-toggle"></i>                            
                        </div>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="branch_name" class="form-label">Branch Name</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="branch_name"
                            id="branch_name">
                            <option value="">Select Branch</option>
                            [[for row in branchList:]]
                            <option value="[[=row.id]]">[[=row.name]]</option>
                            [[pass]]
                        </select>
                    </div>                    
                </div>
                <div class="col-md-4"></div>
              
            </div>
            <div class="row">
                <div class="table-responsive radius">
                        <table class="table table-bordered radius mb-0" id="table_id" style="width: 80%;">
                            
                        </table>
                    </div>
            </div>
            <br>
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-start">
                        <div class="me-2">
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="fa-regular fa-floppy-disk"></i> <span class="ms-2">Post</span>
                            </button>
                        </div>
                        <div class="">
                            <button type="reset" class="btn btn-sm btn-light">
                                <i class="fa-solid fa-retweet"></i> <span class="ms-2">Reset</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </form>
    </div>

</div>
[[end]]
[[block scripts]]
<!-- individual pages can add scripts here -->
<script>
  $(document).ready(function () {
        var active_date = "[[=active_date]]";  
        var expire_at = "[[=expire_at]]";
        var current_date = "[[=str(date_time_list['current_date'])]]";

        var active_date_arr = [];
        if (expire_at == current_date) {
            active_date_arr = active_date.split(',').map(function(dateStr) {
                var date = new Date(dateStr.trim());
                var yyyy = date.getFullYear();
                var mm = String(date.getMonth() + 1).padStart(2, '0');
                var dd = String(date.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;   // always Y-m-d
            });
        } else {
            console.log('not today');
        }

        // Collect backDate → today
        const dates = new Set();
        const today = new Date();
        const backDate = new Date(today);
        "[[if session.get('role') !='super_admin':]]"
        backDate.setDate(today.getDate() - 3);
        "[[pass]]"

        // Helper: format date as Y-m-d
        function formatYMD(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // Add backDate → today (Y-m-d format)
        for (let d = new Date(backDate); d <= today; d.setDate(d.getDate() + 1)) {
            dates.add(formatYMD(new Date(d)));
        }

        // Merge & unique
        const mergedDates = [...active_date_arr, ...Array.from(dates)];
        const activeDates = [...new Set(mergedDates)];

        "[[if session.get('role') !='super_admin':]]"
        flatpickr("#transaction_date", {
            dateFormat: "Y-m-d",   // actual value
            altInput: true,
            altFormat: "d-M-Y",    // show to user
            enable: activeDates,   // must be Y-m-d
            allowInput: true,
        });
        "[[pass]]"



    $('#branch_name').on('change', function () {
        let branchId = $(this).val();

        if (!branchId) {
            $('#table_id').empty();
            return;
        }

        $.ajax({
            url: '[[=URL("default","get_branch_data")]]',
            method: 'GET',
            data: { branch_id: branchId },
            success: function (response) {
                //console.log(response);
                if (response.status === 'Success') {
                    //console.log(response.status);
                    let banks = response.banks;
                    let segments = response.segments;

                    // === Build Table Header ===
                    let thead = `<thead style="background-color: #ccc9fa"><tr>
                        <th>Brand</th>`;

                    banks.forEach(bank => {
                        thead += `<th class="bank-col text-end">${bank.short_name}</th>`;
                    });

                    thead += `</tr></thead>`;

                    // === Build Table Body ===
                    let tbody = `<tbody id="tbody">`;
                    segments.forEach(segment => {
                        // Segment header row
                        tbody += `<tr class="bg-light">
                            <td colspan="${9 + banks.length}">${segment.segment_name}</td>
                        </tr>`;

                        // Brand rows
                        segment.brands.forEach(brand => {
                            tbody += `<tr>
                                <td>
                                    ${brand.name}
                                    <input type="hidden" name="brand_name" value="${brand.id}">
                                </td>`;

                            // Bank columns for each brand
                            banks.forEach(bank => {
                                tbody += `<td style="width: 120px;">
                                    <input type="text" inputmode="decimal" class="form-control form-control-sm no-spinner formatted-number text-end"
                                        name="bank_${bank.id}_${brand.id}" autocomplete="off">
                                </td>`;
                            });

                            tbody += `</tr>`;
                        });
                    });

                    tbody += `</tbody>`;

                    // Insert table
                    $('#table_id').html(thead + tbody);
                }
            }
        });
    });


});


</script>

[[end]]
