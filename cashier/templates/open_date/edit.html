{% extends 'layout.html' %}

{% block header %}
    {% with icon='fa fa-chart-line' breadcamp='Open Date' %}
        {{ block.super }}
    {% endwith %}
{% endblock %}

{% block content %}
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Edit</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <button type="button" class="btn btn-sm btn-light d-none" id="btn_view">
                    <i class="fa-regular fa-eye"></i> <span class="ms-2">View</span>
                </button>
                <button type="button" class="btn btn-sm btn-light" id="btn_edit">
                    <i class="fa-regular fa-pen-to-square"></i> <span class="ms-2">Edit</span>
                </button>
            </div>
            <div class="p-1">
                <a href="{% url 'cashier:open_date-index' %}" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
            <div class="p-1">
                <div class="btn-group">
                    <button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Action
                    </button>
                    <!-- <ul class="dropdown-menu"> -->
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="{% url 'cashier:open_date-delete' %}?id={{ record.id }}" id="delete_btn">
                            <i class="fa-solid fa-trash-can"></i><span class="ms-2">Delete</span></a>
                    </div>
                    <!-- </ul> -->
                </div>
            </div>
        </div>
    </div>
    <div class="container py-2">

        <form action="{% url 'cashier:open_date-update' %}?id={{ record.id }}" method="POST">
            {% csrf_token %}
        <div id="custom_form">        
            <div class="row">                
                <div class="col-md-3">
                    <div class="mb-3 custom_input" >
                        <label for="branch_name" class="form-label">TDCL Branch</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="branch_name"
                            id="branch_name">
                            <option value="">Select Branch</option>
                            {% for row in branchList %}
                            <option value="{{ row.id }}" {% if record.branch_id == row.id %} selected {% endif %}>{{ row.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3 custom_input" >
                        <label for="user_id" class="form-label">Applied for User</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="user_id"
                            id="user_id">
                            <option value="">Select User</option>
                            {% for row in userList %}
                            <option value="{{ row.id }}" {% if record.user_id == row.id %} selected {% endif %}>{{ row.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3 custom_input" >
                        <label for="active_date" class="form-label">Allow Entry From</label>
                        <div class="flatpickr-wrapper">
                            <input type="text" class="form-control form-control-sm date-picker-multi" name="active_date" placeholder="Select From Date" value="{{ record.active_date }}">
                            <i class="fa fa-calendar calendar-icon text-secondary calendar-toggle"></i>                            
                        </div>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <div class="mb-3 custom_input" >
                        <label for="expire_at" class="form-label">Allow Release Upto</label>
                        <div class="flatpickr-wrapper">
                            <input type="text" class="form-control form-control-sm date-picker" name="expire_at" placeholder="Select Date" value="{{ record.expire_at }}">
                            <i class="fa fa-calendar calendar-icon text-secondary calendar-toggle"></i>                            
                        </div>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="mb-3 ">
                        <label for="status" class="form-label">Status</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="1" id="status" name="status" disabled
                            {% if record.status == 1 %} checked {% endif %}>
                            <label class="form-check-label" for="status">
                              Active
                            </label>
                        </div>
                    </div>                    
                </div>
                <div class="col-md-4"></div>
                
              
            </div>
            <div class="row d-none" id="edit_view_section">
                <div class="col-12">
                    <div class="d-flex justify-content-start">
                        <div class="me-2">
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="fa-regular fa-floppy-disk"></i> <span class="ms-2">Update</span>
                            </button>
                        </div>
                        <div class="">
                            <button type="reset" class="btn btn-sm btn-light">
                                <i class="fa-solid fa-retweet"></i> <span class="ms-2">Reset</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </form>
    </div>

</div>
{% endblock %}
{% block scripts %}
<!-- individual pages can add scripts here -->
 <script>
    
$(document).ready(function () {
    $(".date-picker-multi").each(function () {
        var $input = $(this);
        var currentVal = $input.val();
        
        // Ensure multiple dates are correctly parsed from a comma-separated string
        var dateArray = currentVal ? currentVal.split(',') : [];

        var fp = $input.flatpickr({
            disableMobile: true,
            allowInput: true,
            mode: "multiple",          // ✅ multiple date selection
            monthSelectorType: "dropdown",
            dateFormat: "Y-m-d",       // value stored/submitted
            altInput: true,
            altFormat: "d-M-Y",        // user-friendly display
            conjunction: ", ",         // separator used between dates in the input
            defaultDate: dateArray      // pre-load the dates from the input value
        });

        // Toggle calendar open when clicking icon
        $input.closest(".flatpickr-wrapper").find(".calendar-toggle").on("click", function () {
            fp.open();
        });
    });
});

 </script>
 {%endblock%}
