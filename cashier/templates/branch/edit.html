{% extends 'layout.html' %}

{% block header %}
    {% with icon='fa fa-chart-line' breadcamp='Branch' %}
        {{ block.super }}
    {% endwith %}
{% endblock %}

{% block content %}
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Edit</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <button type="button" class="btn btn-sm btn-light d-none" id="btn_view">
                    <i class="fa-regular fa-eye"></i> <span class="ms-2">View</span>
                </button>
                <button type="button" class="btn btn-sm btn-light" id="btn_edit">
                    <i class="fa-regular fa-pen-to-square"></i> <span class="ms-2">Edit</span>
                </button>
            </div>
            <div class="p-1">
                <a href="{% url 'cashier:branch-index' %}" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
            {% comment %}
            <!-- <div class="p-1">
                <div class="btn-group">
                    <button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Action
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="{% url 'cashier:branch-delete' %}?id={{request.query.get('id')}}" id="delete_btn">
                            <i class="fa-solid fa-trash-can"></i><span class="ms-2">Delete</span></a>
                    </div>
                </div>
            </div> -->
            {% endcomment %}
        </div>
    </div>
    <div class="container py-2">

        <form action="{% url 'cashier:branch-update' %}?id={{record.id}}" method="POST">
            {% csrf_token %}
        <div id="custom_form">        
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3 custom_input">
                        <label for="branch_code" class="form-label">Branch Code</label>
                        <input type="text" id="branch_code" name="branch_code" value="{{record.code}}" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3 custom_input">
                        <label for="branch_name" class="form-label">Branch Name</label>
                        <input type="text" id="branch_name" name="branch_name" value="{{record.name}}" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3 custom_input">
                        <label for="short_name" class="form-label">Short Name</label>
                        <input type="text" id="short_name" name="short_name" value="{{record.short_name}}" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3 custom_input">
                        <label for="email" class="form-label">Email</label>
                        <input type="text" id="email" name="email" value="{{record.email}}" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3 custom_input">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" id="address" name="address" value="{{record.address}}" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-4"></div>
                <div class="col-md-8">
                    <div class="mb-3 custom_input">
                        <label for="bank_list" class="form-label">Banks List</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="bank_list" id="bank_list" multiple="multiple">
                            <option value="">Select Bank Lists</option>     
                            {% for row in banksList %}
                            <option value="{{row.id}}" {% if row.id in branch_bank_records %} selected {% endif %}>{{row.name}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-4 d-flex align-items-center" style="margin-top: 28px;">
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" disabled {% if banksList|length == branch_bank_records|length %} checked {% endif %} id="selectAll">
                            <label class="form-check-label" for="selectAll">Select All</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3 ">
                        <label for="status" class="form-label">Status</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="1" id="status" name="status" disabled {% if record.status == 1 %} checked {% endif %}>
                            <label class="form-check-label" for="status">
                              Active
                            </label>
                        </div>
                    </div>                    
                </div>
                <div class="col-md-4"></div>
                
              
            </div>
            <div class="row d-none" id="edit_view_section">
                <div class="col-12">
                    <div class="d-flex justify-content-start">
                        <div class="me-2">
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="fa-regular fa-floppy-disk"></i> <span class="ms-2">Update</span>
                            </button>
                        </div>
                        <div class="">
                            <button type="reset" class="btn btn-sm btn-light">
                                <i class="fa-solid fa-retweet"></i> <span class="ms-2">Reset</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </form>
    </div>

</div>
{% endblock %}

{% block scripts %}
 <script>
    $(document).ready(function() {

        //  Select/Deselect all banks when checkbox changes
        $('#selectAll').on('change', function() {
            if ($(this).is(':checked')) {
                $('#bank_list option[value!=""]').prop('selected', true);
            } else {
                $('#bank_list option').prop('selected', false);
            }
            $('#bank_list').trigger('change'); // important for select2
        });

        //  Listen for changes in the dropdown
        $('#bank_list').on('change', function() {
            let total = $('#bank_list option[value!=""]').length;   // all real options
            let selected = $('#bank_list option:selected').length; // how many selected

            // If all options are selected, check Select All
            // Else uncheck it
            if (selected === total && total > 0) {
                $('#selectAll').prop('checked', true);
            } else {
                $('#selectAll').prop('checked', false);
            }
        });

    });
</script>
{% endblock %}
