[[extend 'layout.html']]

[[block header]]
[[icon='fa fa-chart-line']]
[[breadcamp = 'Imprest Bank Reconciliation']]

[[end]]

[[block content]]
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Create</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <a href="[[=URL('imprest_bank_reconciliation/index')]]" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
        </div>
    </div>
    <div class="container py-2">

        <form action="[[=URL('imprest_bank_reconciliation','check')]]" method="POST">

        <div id="custom_form">        
            <div class="row">                
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="branch_name" class="form-label">Branch</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="branch_name"
                            id="branch_name">
                            <option value="">Select Branch</option>
                            [[for row in branchList:]]
                            <option value="[[=row.id]]" >[[=row.name]]</option>
                            [[pass]]
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="bank_name" class="form-label">Bank</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="bank_name"
                            id="bank_name">
                            <option value="">Select Bank</option>
                            
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="account_number" class="form-label">Account Number</label>
                        <input type="text" id="account_number" name="account_number" class="form-control form-control-sm" readonly>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="yearCombo" class="form-label">Year</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="yearCombo"
                            id="yearCombo">
                            <option value="">Select Year</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="monthCombo" class="form-label">Month</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="monthCombo"
                            id="monthCombo">
                            <option value="">Select Month</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4"></div>
                
              
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-start">
                        <div class="me-2">
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="fa-regular fa-floppy-disk"></i> <span class="ms-2">Check</span>
                            </button>
                        </div>
                        <div class="">
                            <button type="reset" class="btn btn-sm btn-light">
                                <i class="fa-solid fa-retweet"></i> <span class="ms-2">Reset</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </form>
    </div>

</div>
[[end]]
[[block scripts]]
<!-- individual pages can add scripts here -->
 <script>
    $(document).ready(function () {

        // When branch changes, update bank list dynamically
        $('#branch_name').on('change', function () {
            let branchId = $(this).val(); // get selected branch id
            //console.log("Selected Branch ID: ", branchId);
            // Clear bank dropdown and show loading option
            $('#bank_name').html('<option value="">Loading...</option>');

            if (branchId) {
                $.ajax({
                    url: '[[=URL("default","get_banks_by_branch")]]',
                    type: "GET",
                    data: { branch_id: branchId },
                    success: function (response) {
                        $('#bank_name').html('<option value="">Select Bank</option>');

                        response.results.forEach(bank => {
                            $('#bank_name').append(`<option value="${bank.id}">${bank.name}</option>`);
                        });
                    },
                    error: function () {
                        $('#bank_name').html('<option value="">Error loading banks</option>');
                    }
                });
            } else {
                $('#bank_name').html('<option value="">Select Bank</option>');
            }
        });


        $('#bank_name').on('change', function () {
            let branch_name = $('#branch_name').val();
            let bankId = $(this).val();

            if (bankId) {
                $.ajax({
                    url: '[[=URL("default","get_account_by_bank")]]',
                    type: "GET",
                    data: { branch_id: branch_name, bank_id: bankId },
                    success: function (response) {
                        console.log(response); // check API response

                        if (response.results && response.results.length > 0) {
                            $('#account_number').val(response.results[0].account_number || '');
                        } else {
                            $('#account_number').val('');
                        }
                    },
                    error: function () {
                        $('#account_number').val('');
                    }
                });
            } else {
                $('#account_number').val('');
            }
        });



        //==============Year Dropdown=================`
        const startYear = 2018;
        const currentYear = new Date().getFullYear();
        const yearSelect = document.getElementById("yearCombo");

        for (let year = startYear; year <= currentYear; year++) {
            let option = document.createElement("option");
            option.value = year;
            option.textContent = year;
            if (year === currentYear) {
            option.selected = true; // set current year as default
            }
            yearSelect.appendChild(option);
        }
            

        //==============Month Dropdown=================
        const months = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        const currentMonth = new Date().getMonth(); // 0 = Jan, 11 = Dec
        const monthSelect = document.getElementById("monthCombo");

        months.forEach((month, index) => {
            let option = document.createElement("option");
            option.value = index + 1;  // 1–12
            option.textContent = month;
            if (index === currentMonth) {
            option.selected = true; // current month selected
            }
            monthSelect.appendChild(option);
        });


        // const months = [
        //     "January", "February", "March", "April", "May", "June",
        //     "July", "August", "September", "October", "November", "December"
        // ];

        // const currentMonth = new Date().getMonth() + 1; // 1 = Jan, 12 = Dec
        // const monthSelect = document.getElementById("monthCombo");

        // months.forEach((month, index) => {
        //     let option = document.createElement("option");
        //     option.value = index + 1;  // 1–12
        //     option.textContent = month;
        //     if (index + 1 === currentMonth) {
        //         option.selected = true; // current month selected
        //     }
        //     monthSelect.appendChild(option);
        // });


    });
</script>

[[end]]
