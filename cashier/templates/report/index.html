[[block scripts]]
<!-- individual pages can add scripts here -->
<script>
    $(document).ready(function () {
        $('#branch').select2({
            width: '100%'
        });
        //  Select/Deselect all banks when checkbox changes
        $('#selectAll').on('change', function () {
            if ($(this).is(':checked')) {
                $('#branch option[value!=""]').prop('selected', true);
            } else {
                $('#branch option').prop('selected', false);
            }
            $('#branch').trigger('change'); // important for select2
        });

        //  Listen for changes in the dropdown
        $('#branch').on('change', function () {
            let total = $('#branch option[value!=""]').length;   // all real options
            let selected = $('#branch option:selected').length; // how many selected

            // If all options are selected, check Select All
            // Else uncheck it
            if (selected === total && total > 0) {
                $('#selectAll').prop('checked', true);
            } else {
                $('#selectAll').prop('checked', false);
            }

            setTimeout(function () {
                $('.select2-selection__choice')
                    .addClass('bg-info text-white border-0'); // Bootstrap style
            }, 0);
        });



        //=====================Segment Select All==========================
        $('#segment').select2({
            width: '100%'
        });
        //  Select/Deselect all banks when checkbox changes
        $('#segmentSelectAll').on('change', function () {
            if ($(this).is(':checked')) {
                $('#segment option[value!=""]').prop('selected', true);
            } else {
                $('#segment option').prop('selected', false);
            }
            $('#segment').trigger('change'); // important for select2
        });

        //  Listen for changes in the dropdown
        $('#segment').on('change', function () {
            let total = $('#segment option[value!=""]').length;   // all real options
            let selected = $('#segment option:selected').length; // how many selected

            // If all options are selected, check Select All
            // Else uncheck it
            if (selected === total && total > 0) {
                $('#segmentSelectAll').prop('checked', true);
            } else {
                $('#segmentSelectAll').prop('checked', false);
            }

            setTimeout(function () {
                $('.select2-selection__choice')
                    .addClass('bg-info text-white border-0'); // Bootstrap style
            }, 0);

            // Fetch segment-wise brands via AJAX
            let selectedSegments = $(this).val() || [];
            let segmentsStr = selectedSegments.join(',');
            $.ajax({
                url: "[[=URL('report', 'get_brands_by_segment')]]",
                type: 'GET',
                data: { segments: segmentsStr },
                dataType: 'json',
                success: function (response) {
                    let brandSelect = $('#brand');
                    let currentSelected = brandSelect.val() || [];
                    
                    brandSelect.empty();
                    brandSelect.append('<option value="">Select Brand </option>');
                    
                    if (response.brands && response.brands.length > 0) {
                        response.brands.forEach(function (brand) {
                            let isSelected = currentSelected.includes(brand.id.toString()) ? 'selected' : '';
                            brandSelect.append('<option value="' + brand.id + '" ' + isSelected + '>' + brand.name + '</option>');
                        });
                    }
                    
                    brandSelect.trigger('change');
                },
                error: function (xhr, status, error) {
                    console.error("Failed to fetch brands:", error);
                }
            });
        });



        //=====================Brand Select All==========================
        $('#brand').select2({
            width: '100%'
        });
        //  Select/Deselect all banks when checkbox changes
        $('#brandSelectAll').on('change', function () {
            if ($(this).is(':checked')) {
                $('#brand option[value!=""]').prop('selected', true);
            } else {
                $('#brand option').prop('selected', false);
            }
            $('#brand').trigger('change'); // important for select2
        });

        //  Listen for changes in the dropdown
        $('#brand').on('change', function () {
            let total = $('#brand option[value!=""]').length;   // all real options
            let selected = $('#brand option:selected').length; // how many selected

            // If all options are selected, check Select All
            // Else uncheck it
            if (selected === total && total > 0) {
                $('#brandSelectAll').prop('checked', true);
            } else {
                $('#brandSelectAll').prop('checked', false);
            }

            setTimeout(function () {
                $('.select2-selection__choice')
                    .addClass('bg-info text-white border-0'); // Bootstrap style
            }, 0);
        });


        //==============Year Dropdown=================`
        const startYear = 2020;
        const currentYear = new Date().getFullYear();
        const yearSelect = document.getElementById("yearCombo");

        for (let year = currentYear; year >= startYear; year--) {
            let option = document.createElement("option");
            option.value = year;
            option.textContent = year;
            if (year === currentYear) {
                option.selected = true; // set current year as default
            }
            yearSelect.appendChild(option);
        }


        //==============Month Dropdown=================
        const months = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        const currentMonth = new Date().getMonth(); // 0 = Jan, 11 = Dec
        const monthSelect = document.getElementById("monthCombo");

        months.forEach((month, index) => {
            let option = document.createElement("option");
            option.value = index + 1;  // 1–12
            option.textContent = month;
            if (index === currentMonth) {
                option.selected = true; // current month selected
            }
            monthSelect.appendChild(option);
        });

    });
</script>
[[end]]
