{% extends 'layout.html' %}

{% block header %}
    {% with icon='fa fa-chart-line' breadcamp='Brand' %}
        {{ block.super }}
    {% endwith %}
{% endblock %}

{% block content %}
<style>
.select2-selection__choice {
    background-color: #0dcaf0 !important;  /* Bootstrap bg-info color */
    color: #fff !important;
    border: none !important;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 2px;
}

</style>
<div class="container-section">
    <div class="d-flex justify-content-between align-items-center border-bottom">
        <span class="icon-text icon-text-bold">
            <i class="fa-solid fa-plus"></i>
            <span>Create</span>
        </span>

        <div class="d-flex justify-content-end">
            <div class="p-1">
                <a href="{% url 'cashier:brand-index' %}" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i> <span class="ms-2">Back</span>
                </a>
            </div>
        </div>
    </div>
    <div class="container py-2">

        <form action="{% url 'cashier:brand-submit' %}" method="POST">
            {% csrf_token %}
        <div id="custom_form">        
            <div class="row">                
                <div class="col-md-3">
                    <div class="mb-3">
                        <label for="brand_code" class="form-label">Code</label>
                        <input type="text" id="brand_code" name="brand_code" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label for="brand_name" class="form-label">Brand Name</label>
                        <input type="text" id="brand_name" name="brand_name" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label for="short_name" class="form-label">Short Name</label>
                        <input type="text" id="short_name" name="short_name" class="form-control form-control-sm">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label for="segment" class="form-label">Segment</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="segment"
                            id="segment">
                            <option value="">Select Segment</option>
                            {% for row in segmentList %}
                            <option value="{{row.id}}">{{row.name}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="mb-3">
                        <label for="branch_list" class="form-label">Branch List</label>
                        <select class="select_custom form-control form-select-sm selectChange" name="branch_list" id="branch_list" multiple="multiple">
                            <option value="">Select Branch Lists</option>     
                            {% for row in branchList %}
                            <option value="{{row.id}}">{{row.name}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-4 d-flex align-items-center" style="margin-top: 28px;">
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="selectAll">
                            <label class="form-check-label" for="selectAll">Select All</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="1" checked id="status" name="status">
                            <label class="form-check-label" for="status">
                              Active
                            </label>
                        </div>
                    </div>                    
                </div>
                <div class="col-md-4"></div>
                
              
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-start">
                        <div class="me-2">
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="fa-regular fa-floppy-disk"></i> <span class="ms-2">Save</span>
                            </button>
                        </div>
                        <div class="">
                            <button type="reset" class="btn btn-sm btn-light">
                                <i class="fa-solid fa-retweet"></i> <span class="ms-2">Reset</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </form>
    </div>

</div>
{% endblock %}
{% block scripts %}
<!-- individual pages can add scripts here -->
 <script>
    $(document).ready(function() {
        $('#branch_list').select2({
            width: '100%'
        });
        //  Select/Deselect all banks when checkbox changes
        $('#selectAll').on('change', function() {
            if ($(this).is(':checked')) {
                $('#branch_list option[value!=""]').prop('selected', true);
            } else {
                $('#branch_list option').prop('selected', false);
            }
            $('#branch_list').trigger('change'); // important for select2
        });

        //  Listen for changes in the dropdown
        $('#branch_list').on('change', function() {
            let total = $('#branch_list option[value!=""]').length;   // all real options
            let selected = $('#branch_list option:selected').length; // how many selected
                        
            // If all options are selected, check Select All
            // Else uncheck it
            if (selected === total && total > 0) {
                $('#selectAll').prop('checked', true);
            } else {
                $('#selectAll').prop('checked', false);
            }

            setTimeout(function () {
                $('.select2-selection__choice')
                    .addClass('bg-info text-white border-0'); // Bootstrap style
            }, 0);
        });

    });
</script>
{% endblock %}
